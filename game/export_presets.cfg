[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="painted_desktop"
export_filter="all_resources"
include_filter="LICENSES.txt,content/*.json,assets/audio/*.json,assets/illustrated/cast/*/*.json"
exclude_filter="tests/*,qa/*"
export_path="../builds/web/play.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="../.tools/templates/web_nothreads_debug.zip"
custom_template/release="../.tools/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
