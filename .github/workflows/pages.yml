name: Publish Night Nine to GitHub Pages

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: night-nine-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the official Godot 4.7.2 editor and matching Web template
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          editor=Godot_v4.7.2-stable_linux.x86_64.zip
          templates=Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --location --retry 3 --output "$editor" "$base/$editor"
          curl --fail --location --retry 3 --output "$templates" "$base/$templates"
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $editor" | sha512sum --check
          echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  $templates" | sha512sum --check
          unzip -q "$editor"
          unzip -q "$templates" templates/web_nothreads_release.zip
      - name: Build the game and matching source
        run: |
          python3 tools/build-pages.py --godot "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --template "$RUNNER_TEMP/templates/web_nothreads_release.zip" --output builds/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested commit
        id: deployment
        uses: actions/deploy-pages@v4
